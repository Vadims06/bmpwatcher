# Fluent Bit pipeline: tail one or more bmpwatcher events.jsonl streams ->
# lua -> http/stdout, in Topolograph's event format (flat event fields plus one
# nested family_data), the same format ospfwatcher's Fluent Bit filter sends.
# This is a standalone service, not tied to any one bmpwatcher deployment:
# EVENTS_GLOB may match multiple events.jsonl files (e.g. one per lab) and
# each gets routed through the same filter/output via the tag wildcard, so
# a new lab needs no fluent-bit config or restart, only a matching path.
# Webhook env: WEBHOOK_HOST, WEBHOOK_PORT, WEBHOOK_URI (e.g. / or /receiver/events), WEBHOOK_TLS_ON (on|off).

service:
  flush: 1
  log_level: info
  daemon: off
  parsers_file: parsers.conf
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020

pipeline:
  inputs:
    - name: tail
      tag: bmp.*
      path: ${EVENTS_GLOB}
      parser: bmp_events
      read_from_head: false
      refresh_interval: 1
      rotate_wait: 1
      mem_buf_limit: 50MB
      skip_long_lines: on

  filters:
    - name: lua
      match: bmp.*
      script: parse_events.lua
      call: parse_events

  outputs:

    - name: http
      match: bmp.*
      host: ${WEBHOOK_HOST}
      port: ${WEBHOOK_PORT}
      uri: ${WEBHOOK_URI}
      format: json
      json_date_key: false
      retry_limit: 3
      tls: ${WEBHOOK_TLS_ON}
      header: Authorization Bearer ${TOPOLOGRAPH_API_TOKEN}

    - name: stdout
      match: bmp.*
      format: json
      json_date_key: false
