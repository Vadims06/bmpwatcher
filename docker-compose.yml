# The collector posts its topology and a heartbeat straight to Topolograph with
# a BMP watcher token; it stops when the token ends or Topolograph stays silent.
#   docker compose --profile collector up -d
services:
  bmpwatcher:
    profiles: ["collector"]
    image: ${BMP_IMAGE:-${REGISTRY_PREFIX:-}vadims06/bmpwatcher:${WATCHER_VERSION:-v1.2.0}}
    container_name: ${BMP_CONTAINER_NAME:-bmpwatcher}
    # An ended token exits 0 and must stay stopped; other failures restart.
    restart: on-failure
    ports:
      - "${BMP_PORT:-11019}:11019"
    environment:
      TOPOLOGRAPH_HOST: ${TOPOLOGRAPH_HOST}
      TOPOLOGRAPH_PORT: ${TOPOLOGRAPH_PORT:-443}
      TOPOLOGRAPH_API_TOKEN: ${TOPOLOGRAPH_API_TOKEN}
    command: --bmp-port=11019
