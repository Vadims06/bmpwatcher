frr defaults traditional
hostname r14
no ipv6 forwarding
!
password zebra
enable password zebra
!
interface eth1
 ip address 10.14.111.1/30
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
exit
!
interface eth2
 ip address 10.14.110.1/30
 ip ospf 1 area 0
 ip ospf network point-to-point
 ip ospf cost 10
exit
!
interface lo
 ip address 123.14.14.14/32
 ip ospf 1 area 0
exit
!
router ospf 1
 ospf router-id 123.14.14.14
exit
!
router bgp 65000
 bgp router-id 123.14.14.14
 no bgp default ipv4-unicast
 neighbor RRS peer-group
 neighbor RRS remote-as 65000
 neighbor RRS update-source lo
 neighbor RRS timers 3 9
 neighbor 123.123.100.100 peer-group RRS
 neighbor 123.123.101.101 peer-group RRS
 !
 address-family l2vpn evpn
  neighbor RRS activate
  advertise-all-vni
 exit-address-family
exit
!
vrf tenant1
 vni 5000
exit-vrf
!
router bgp 65000 vrf tenant1
 bgp router-id 123.14.14.14
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
